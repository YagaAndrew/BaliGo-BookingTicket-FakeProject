<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="booking.css" />
    <title>BaliGo Fastboat/Booking</title>
  </head>
  <body>
    <!-- NAV SECTION -->
    <section class="hero" id="fastboat">
      <header class="navbar">
        <a href="#" class="brand">
          <img src="assets/logo.png" alt="BaliGo FastBoat Logo" />
          <div class="brand-text">
            <h2>BALI GO FASTBOAT</h2>
            <span>Your Friendly Booking Agent</span>
          </div>
        </a>
        <nav aria-label="Main Navigation">
          <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#">Tour & Activities</a></li>
            <li><a href="#">Fast Boat</a></li>
            <li><a href="#">Booking</a></li>
          </ul>
        </nav>
      </header>
    </section>
    <!-- MAIN -->
    <main>
      <section class="booking-header">
        <h1>Book Your Tickets</h1>
        <p>Book easily and conveniently</p>
      </section>
      <!-- BOOKING FORM -->
      <section class="booking-box">
        <form id="booking-form">
          <!-- Trip type -->
          <div class="trip-type">
            <label>
              <input type="radio" name="trip" value="oneway" checked />
              <strong>ONE WAY</strong>
            </label>
            <label>
              <input type="radio" name="trip" value="return" />
              <strong>RETURN</strong>
            </label>
          </div>
          <!-- Row 1 -->
          <div class="form-row">
            <div class="form-group">
              <label for="from">From</label>
              <select id="from">
                <option value="">Departure Harbor</option>
                <option value="Sanur(Bali)">Sanur(Bali)</option>
                <option value="Banjar Nyuh(Nusa Penida)">
                  Banjar Nyuh(Nusa Penida)
                </option>
                <option value="Kusamba(Bali)">Kusamba(Bali)</option>
                <option value="Sampalan(Nusa Penida)">
                  Sampalan(Nusa Penida)
                </option>
              </select>
            </div>
            <div class="form-group">
              <label for="to">To</label>
              <select id="to">
                <option value="">Arrival Harbor</option>
                <option value="Sanur(Bali)">Sanur(Bali)</option>
                <option value="Banjar Nyuh(Nusa Penida)">
                  Banjar Nyuh(Nusa Penida)
                </option>
                <option value="Kusamba(Bali)">Kusamba(Bali)</option>
                <option value="Sampalan(Nusa Penida)">
                  Sampalan(Nusa Penida)
                </option>
              </select>
            </div>
          </div>
          <!-- Row 2 -->
          <div class="form-row">
            <div class="form-group">
              <label for="departureDate">Departure Date</label>
              <input
                type="date"
                id="departureDate"
                placeholder="Select Your Date"
              />
            </div>
            <div class="form-group return-date" id="returnDateGroup">
              <label for="returnDate">Return Date</label>
              <input
                type="date"
                id="returnDate"
                placeholder="Select Your Date"
              />
            </div>
          </div>
          <!-- Row 3 -->
          <div class="button-row">
            <button type="submit" class="find-button">
              <span class="search-icon"
                ><img src="assets/search-icon.png" alt="search icon"
              /></span>
              Find Ticket
            </button>
          </div>
        </form>
      </section>
      <script>
        const tripRadios = document.querySelectorAll('input[name="trip"]');
        const returnDateGroup = document.getElementById("returnDateGroup");

        tripRadios.forEach((radio) => {
          radio.addEventListener("change", () => {
            if (radio.value === "return" && radio.checked) {
              returnDateGroup.classList.add("show");
            } else {
              returnDateGroup.classList.remove("show");
            }
          });
        });
      </script>
    </main>
    <script src="booking.js"></script>
  </body>
</html>
