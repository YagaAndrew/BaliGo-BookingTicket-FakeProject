<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>BaliGo FastBoat</title>
  </head>
  <body>
    <main>
      <!-- HERO SECTION -->
      <section class="hero" id="home">
        <header class="navbar">
          <a href="#" class="brand">
            <img src="assets/logo.png" alt="BaliGo FastBoat Logo" />
            <div class="brand-text">
              <h2>BALI GO FASTBOAT</h2>
              <span>Your Friendly Booking Agent</span>
            </div>
          </a>
          <nav aria-label="Main Navigation">
            <ul class="nav-links">
              <li><a href="#">Home</a></li>
              <li><a href="#">Tour & Activities</a></li>
              <li><a href="#">Fast Boat</a></li>
              <li><a href="#">Booking</a></li>
            </ul>
          </nav>
        </header>

        <div class="hero-content">
          <p class="subtitle">Sail To Nusa Penida With The Go Cruise</p>
          <h1>Easy Online Booking By BaliGo</h1>

          <!-- FEATURES -->
          <div class="features">
            <div class="feature">
              <span class="icon"
                ><img src="assets/white-checklist-icon.png" alt="checklist"
              /></span>
              <span>100% Refund Guaranted</span>
              <span class="icon"
                ><img src="assets/white-checklist-icon.png" alt="checklist"
              /></span>
              <span>Instant Confirmation</span>
              <span class="icon"
                ><img src="assets/white-checklist-icon.png" alt="checklist"
              /></span>
              <span>Free Re-Schedule</span>
            </div>
          </div>
          <!-- BOOKING BUTTON -->
          <a href="#" class="button">BOOK NOW</a>
        </div>
      </section>
    </main>
  </body>
</html>
